image: docker.uib.gmbh/opsi/dev/pybuilder:deb9-py3.11

stages:
  - test
  - build
  - viruscheck

viruscheck:virustotal:
  stage: viruscheck
  tags:
    - win10-x64
  script:
    - irm "${OPSIDEVTOOLS_INSTALLER_URL_WINDOWS_X86}" | iex
    - opsi-dev-cli -l info --output-format summary virustotal check opsiclientd_windows_x86\opsiclientd.exe --allow-detections=5 > viruscheck.txt
  artifacts:
    name: "opsiclientd_viruscheck"
    paths:
      - viruscheck.txt
    expire_in: 14 days
  only:
    - tags
  except:
    variables:
      - $SKIP_TESTS

test:pytest-darwin:
  stage: test
  tags:
    - catalina-py311-x64
  script:
    - export UV_PYTHON="3.13-x86_64"
    - export UV_PYTHON_PREFERENCE="only-managed"
    - uv self update
    - uv sync --frozen
    - uv run pytest --tb=short -x -o junit_family=xunit2 --junitxml=testreport.xml --cov-config .coveragerc --cov opsiclientd --cov-report term --cov-report xml -v tests
    - mv .coverage coverage_darwin
  artifacts:
    name: "opsiclientd_test_darwin"
    paths:
      - coverage.xml
      - testreport.xml
      - coverage_darwin
    expire_in: 3 days
  except:
    variables:
      - $SKIP_TESTS

test:pytest-windows:
  stage: test
  tags:
    - win10-x64
  script:
    - $Env:UV_PYTHON_INSTALL_DIR = "c:\\uv\\python"
    - $Env:UV_CACHE_DIR = "c:\\uv\\cache"
    # Using Python 3.11 for compatibility with Windows 7
    - $Env:UV_PYTHON = "3.11-x86"
    - $Env:UV_PYTHON_PREFERENCE = "only-managed"
    - $Env:RUSTUP_TOOLCHAIN = "stable-i686-pc-windows-msvc"
    - uv sync --frozen
    - uv run pytest --tb=short -x -o junit_family=xunit2 --junitxml=testreport.xml --cov-config .coveragerc --cov opsiclientd --cov-report term --cov-report xml -v tests
    - Rename-Item -Path .coverage -NewName coverage_windows
  artifacts:
    name: "opsiclientd_test_windows"
    paths:
      - coverage.xml
      - testreport.xml
      - coverage_windows
    expire_in: 3 days
  except:
    variables:
      - $SKIP_TESTS

test:pytest-linux:
  stage: test
  script:
    - export UV_PYTHON="3.13-x86_64"
    - export UV_PYTHON_PREFERENCE="only-managed"
    - uv self update
    - uv sync --frozen
    # Start opsiclientd in background
    - mkdir -p /var/log/opsi-client-agent /etc/opsi-client-agent /usr/share/opsi-client-agent/opsiclientd
    - cp -a opsiclientd_data/common/static_html /usr/share/opsi-client-agent/opsiclientd/static_html
    - uv run opsiclientd --config-file=tests/data/opsiclientd.conf -l 1 &
    - sleep 8
    # Run tests
    - uv run pytest --tb=short -x -o junit_family=xunit2 --junitxml=testreport.xml --cov-config .coveragerc --cov opsiclientd --cov-report term --cov-report xml -v tests
    - mv .coverage coverage_linux
  artifacts:
    name: "opsiclientd_test_linux"
    paths:
      - coverage.xml
      - testreport.xml
      - coverage_linux
    expire_in: 3 days
  except:
    variables:
      - $SKIP_TESTS

lint-pytest:
  stage: test
  needs:
    # We want to combine test coverage from all test jobs
    - job: test:pytest-windows
      artifacts: true
    - job: test:pytest-darwin
      artifacts: true
    - job: test:pytest-linux
      artifacts: true
  script:
    - export UV_PYTHON="3.13-x86_64"
    - export UV_PYTHON_PREFERENCE="only-managed"
    - uv self update
    - uv sync --frozen
    - uv run ruff check opsiclientd tests
    - uv run ty check opsiclientd tests
    - opsi-dev-cli self upgrade
    - opsi-dev-cli -l info testing merge-junit-testreports testreport_*.xml testreport.xml
    - opsi-dev-cli -l info testing merge-coverage-files coverage_* .coverage
    - opsi-dev-cli -l info testing coverage-report
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+)%/'
  artifacts:
    name: "opsiclientd_test"
    paths:
      - coverage.xml
    expire_in: 3 days
  except:
    variables:
      - $SKIP_TESTS

build:pyinstaller-linux-x64:
  stage: build
  script:
    - export UV_PYTHON="3.13-x86_64"
    - export UV_PYTHON_PREFERENCE="only-managed"
    - TRANSIFEX_MIN_REVIEW_RATE=0.0
    - '[ "$CI_COMMIT_TAG" = "" ] || TRANSIFEX_MIN_REVIEW_RATE=1.0'
    - curl -sS "${OPSIDEVTOOLS_INSTALLER_URL_LINUX_X64}" | sh
    - uv self update
    - uv sync --frozen
    - uv run opsi-dev-cli -l info pyinstaller build
    - mv dist/opsiclientd opsiclientd_linux_x64
    # Check if binary is working
    - ./opsiclientd_linux_x64/opsiclientd --version
    # Push to binaryindex
    - '[ "$CI_COMMIT_TAG" = "" ] && opsi-dev-cli -l info binary push opsiclientd_linux_x64 --prerelease="$CI_JOB_ID"'
    - '[ "$CI_COMMIT_TAG" = "" ] || opsi-dev-cli -l info binary push opsiclientd_linux_x64'

build:pyinstaller-macos-x64:
  stage: build
  tags:
    - catalina-py311-x64
  script:
    - export UV_PYTHON="3.13-x86_64"
    - export UV_PYTHON_PREFERENCE="only-managed"
    - TRANSIFEX_MIN_REVIEW_RATE=0.0
    - '[ "$CI_COMMIT_TAG" = "" ] || TRANSIFEX_MIN_REVIEW_RATE=1.0'
    - curl -sS "${OPSIDEVTOOLS_INSTALLER_URL_MACOS_X64}" | sh
    - uv self update
    - uv sync --frozen
    - uv run opsi-dev-cli -l info pyinstaller build
    - mv dist/opsiclientd opsiclientd_darwin_x64
    # Check if binary is working
    - ./opsiclientd_darwin_x64/opsiclientd --version
    # Push to biaryindex
    - '[ "$CI_COMMIT_TAG" = "" ] && opsi-dev-cli -l info binary push opsiclientd_darwin_x64 --prerelease="$CI_JOB_ID"'
    - '[ "$CI_COMMIT_TAG" = "" ] || opsi-dev-cli -l info binary push opsiclientd_darwin_x64'

build:pyinstaller-windows-x86:
  stage: build
  tags:
    - win10-x64
  script:
    - $Env:UV_PYTHON_INSTALL_DIR = "c:\\uv\\python"
    - $Env:UV_CACHE_DIR = "c:\\uv\\cache"
    # Using Python 3.11 for compatibility with Windows 7
    - $Env:UV_PYTHON = "3.11-x86"
    - $Env:UV_PYTHON_PREFERENCE = "only-managed"
    - $Env:RUSTUP_TOOLCHAIN = "stable-i686-pc-windows-msvc"
    - $Env:TRANSIFEX_MIN_REVIEW_RATE="0.0"
    - if ($CI_COMMIT_TAG) { $Env:TRANSIFEX_MIN_REVIEW_RATE="1.0" }
    - irm "${OPSIDEVTOOLS_INSTALLER_URL_WINDOWS_X86}" | iex
    - uv run opsi-dev-cli -l debug pyinstaller build
    - opsi-dev-cli -l info signserver sign dist\opsiclientd\
    - Move-Item -Path dist\opsiclientd -Destination opsiclientd_windows_x86
    # Check if binary is working
    - opsiclientd_windows_x86\opsiclientd.exe --version
    # Push to biaryindex
    - if (! $CI_COMMIT_TAG) {opsi-dev-cli -l info binary push opsiclientd_windows_x86 --prerelease="$CI_JOB_ID"}
    - if ($CI_COMMIT_TAG) {opsi-dev-cli -l info binary push opsiclientd_windows_x86}
  artifacts:
    name: "opsiclientd_windows_x86"
    paths:
      - opsiclientd_windows_x86\opsiclientd.exe

build:pyinstaller-windows-x64:
  stage: build
  tags:
    - win10-x64
  script:
    - $Env:UV_PYTHON_INSTALL_DIR = "c:\\uv\\python"
    - $Env:UV_CACHE_DIR = "c:\\uv\\cache"
    - $Env:UV_PYTHON = "3.13-x86_64"
    - $Env:UV_PYTHON_PREFERENCE = "only-managed"
    - $Env:RUSTUP_TOOLCHAIN = "stable-x86_64-pc-windows-msvc"
    - $Env:TRANSIFEX_MIN_REVIEW_RATE="0.0"
    - if ($CI_COMMIT_TAG) { $Env:TRANSIFEX_MIN_REVIEW_RATE="1.0" }
    - irm "${OPSIDEVTOOLS_INSTALLER_URL_WINDOWS_X64}" | iex
    - uv run opsi-dev-cli -l debug pyinstaller build
    - opsi-dev-cli -l info signserver sign dist\opsiclientd\
    - Move-Item -Path dist\opsiclientd -Destination opsiclientd_windows_x64
    # Check if binary is working
    - opsiclientd_windows_x64\opsiclientd.exe --version
    # Push to biaryindex
    - if (! $CI_COMMIT_TAG) {opsi-dev-cli -l info binary push opsiclientd_windows_x64 --prerelease="$CI_JOB_ID"}
    - if ($CI_COMMIT_TAG) {opsi-dev-cli -l info binary push opsiclientd_windows_x64}
  artifacts:
    name: "opsiclientd_windows_x64"
    paths:
      - opsiclientd_windows_x64\opsiclientd.exe