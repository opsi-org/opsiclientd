[project]
name = "opsiclientd"
version = "4.3.13.5"
description = "opsi client daemon. The service running on opsi clients."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11,<3.14"
dependencies = [
	"annotated-types>=0.7",
	"anyio>=4.6",
	"click>=8.1",
	"fastapi>=0.115",
	"h11>=0.14",
	"macholib>=1.14",
	"netifaces>=0.11",
	"pydantic>=2.9,<2.11",
	"pydantic-core>=2.20,<2.29",
	"pyelftools>=0.31",
	"python-multipart>=0.0",
	"python-opsi>=4.3.7.1,<4.4",
	"python-opsi-common>=4.3.30.3,<4.4",
	"six>=1.16",
	"starlette>=0.39",
	"uvicorn>=0.34",
	"websockets>=14.1",
	"zeroconf>=0.136",
	"cryptography>=42.0.0,<43.0.0",
	"pyzsync>=1.2.6,<1.3",
	"distro>=1.5; platform_system == 'Linux'",
	"macholib>=1.14; platform_system == 'Darwin'",
	"pywin32>=308; platform_system == 'Windows'",
	"pywinpty>=2.0; platform_system == 'Windows'",
	"wmi>=1.5; platform_system == 'Windows'",
	"pefile>=2024.8; platform_system == 'Windows'",
	"websocket-client>=1.8.0",
]
[[project.authors]]
name = "uib GmbH"
email = "info@uib.de"

[[project.maintainers]]
name = "uib GmbH"
email = "info@uib.de"

[dependency-groups]
dev = [
	"httpx>=0.28",
	"mock>=5.0",
	"mypy>=1.4",
	"pyinstaller>=6.10",
	"pytest>=8.0",
	"pytest-cov>=6.0",
	"ruff>=0.8",
	"types-mock>=5.1",
	"types-psutil>=6.0",
	"types-pyopenssl>=24.0",
	"types-pywin32>=308.0",
	"types-requests>=2.31",
	"pywin32-ctypes>=0.2; platform_system == 'Windows'",
	# Pin setuptools to avoid warning:
	# See https://setuptools.pypa.io/en/latest/pkg_resources.html.
	# The pkg_resources package is slated for removal as early as 2025-11-30. Refrain from using this package or pin to Setuptools<81.
	"setuptools>=71.0,<80.9",
]

[project.urls]
Homepage = "https://www.opsi.org"

[project.scripts]
opsiclientd = "opsiclientd.__main__:opsiclientd"
opsiclientd_rpc = "opsiclientd.__main__:opsiclientd_rpc"
action_processor_starter = "opsiclientd.__main__:action_processor_starter"

[tool.uv]
extra-index-url = ["https://pypi.uib.gmbh/simple"]
index-strategy = "unsafe-best-match"
package = true

[tool.ruff]
line-length = 140

[tool.mypy]
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
follow_imports = "silent"

[tool.ruff.lint]
ignore = ["E402"]

[tool.ruff.format]
indent-style = "tab"

[tool.setuptools.package-data]
opsiclientd_data = ["**/*"]

[tool.setuptools.packages.find]
include = [
	"opsiclientd",
	"opsiclientd.*",
	"opsiclientd_data",
	"opsiclientd_data.*",
]
