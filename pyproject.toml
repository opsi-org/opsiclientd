[project]
name = "opsiclientd"
version = "4.3.24.2"
description = "opsiclientd. The service running on opsi clients."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.13,<3.15"
dependencies = [
	"annotated-types>=0.7",
	"anyio>=4.6",
	"click>=8.1",
	"fastapi>=0.115",
	"h11>=0.14",
	"macholib>=1.14",
	"netifaces>=0.11",
	"pydantic>=2.13",
	"pydantic-core>=2.46",
	"pyelftools>=0.31",
	"python-multipart>=0.0",
	"python-opsi-legacy>=4.3.9.8,<4.4",
	"python-opsi>=4.3.26.2,<4.4",
	"six>=1.16",
	"starlette>=0.39",
	"uvicorn>=0.34",
	"websockets>=14.1",
	"zeroconf>=0.136",
	"cryptography>=50.0.0",
	"pyzsync>=1.2.6",
	"distro>=1.5; platform_system == 'Linux'",
	"macholib>=1.14; platform_system == 'Darwin'",
	"pywin32>=308; platform_system == 'Windows'",
	"pywinpty>=3.0; platform_system == 'Windows'",
	"wmi>=1.5; platform_system == 'Windows'",
	"pefile>=2024.8; platform_system == 'Windows'",
	"winrt-Windows.Foundation>=3.2.1; platform_system == 'Windows'",
	"winrt-Windows.Foundation.Collections>=3.2.1; platform_system == 'Windows'",
	"winrt-Windows.Networking.Connectivity>=3.2.1; platform_system == 'Windows'",
	"winrt-runtime>=3.2.1; platform_system == 'Windows'",
	"websocket-client>=1.8.0",
]
[[project.authors]]
name = "uib GmbH"
email = "info@uib.de"

[[project.maintainers]]
name = "uib GmbH"
email = "info@uib.de"

[dependency-groups]
dev = [
	"httpx>=0.28",
	"mock>=5.0",
	"pyinstaller>=6.10",
	"pytest>=8.0",
	"pytest-cov>=6.0",
	"ruff>=0.8",
	"types-mock>=5.1",
	"types-psutil>=6.0",
	"types-pyopenssl>=24.0",
	"types-pywin32>=308.0",
	"types-requests>=2.31",
	"pywin32-ctypes>=0.2; platform_system == 'Windows'",
	"setuptools>=83.0",
	"ty>=0.0.8",
]

[project.urls]
Homepage = "https://www.opsi.org"

[project.scripts]
opsiclientd = "opsiclientd.__main__:opsiclientd"
opsiclientd_rpc = "opsiclientd.__main__:opsiclientd_rpc"
action_processor_starter = "opsiclientd.__main__:action_processor_starter"

[tool.uv]
extra-index-url = ["https://pypi.uib.gmbh/simple"]
index-strategy = "unsafe-best-match"
package = true

[tool.ruff]
line-length = 140

[tool.ruff.lint]
ignore = [
	"E402",
	"BLE001", # blind-except: catching broad Exception is intentional in this long-running daemon
	"N999",   # invalid-module-name: CamelCase module names are part of the established public layout
	"S102",   # exec-builtin: exec() is a deliberate feature of the RPC control interface
	"S110",   # try-except-pass: intentionally ignored errors
	"TRY401", # verbose-log-message: exception text is intentionally included in log messages
]

[tool.ruff.lint.flake8-bugbear]
# fastapi.Query is designed to be used as a default argument value
extend-immutable-calls = ["fastapi.Query"]

[tool.ruff.format]
indent-style = "tab"

[tool.ty.environment]
python = ".venv/bin/python"

[tool.setuptools.package-data]
opsiclientd_data = ["**/*"]

[tool.setuptools.packages.find]
include = [
	"opsiclientd",
	"opsiclientd.*",
	"opsiclientd_data",
	"opsiclientd_data.*",
]
