transifex:
  upload_resources:
    - organization: opsi-org
      project: opsiorg
      resource_name: opsiclientd.pot
      scan_sources:
        - opsiclientd
  download_translations:
    - organization: opsi-org
      project: opsiorg
      resource_name: opsiclientd.pot
      install_dir: opsiclientd_data/locale
      min_review_rate: $TRANSIFEX_MIN_REVIEW_RATE
      languages:
        - de
        - fr
    - organization: opsi-org
      project: opsiorg
      resource_name: opsiclientd.pot
      install_dir: opsiclientd_data/locale
      min_translation_rate: $TRANSIFEX_MIN_REVIEW_RATE

pyinstaller:
  one_file: no
  hidden_imports:
    all:
      - csv
      # opsi_legacy.Util.Ping needed for dynamic depot selection
      - opsi_legacy.Util.Ping
    windows:
      - pythoncom
      - win32com
      - pywintypes
      - win32api
      - win32timezone
      - opsi_legacy.Backend.Manager.Authentication.NT
    linux:
      - opsi_legacy.Backend.Manager.Authentication.PAM
    darwin:
      - opsi_legacy.Backend.Manager.Authentication.PAM
  collect_submodules:
    - uvicorn
    - websockets
    - h11
  extra_args:
    windows:
      - --manifest
      - opsiclientd-windows.manifest
      ## Without --noconsole opsiclientd_rpc and action_processor_starter are opening console windows
      #- --noconsole
    darwin:
      - --exclude-module
      - tkinter
  scripts:
    - script: opsiclientd/__main__.py
      binaries:
        - opsiclientd
        - opsiclientd_rpc
        - action_processor_starter
  icon: opsiclientd_data/windows/opsi.ico
  data_files:
    # from opsiclientd
    - src: opsiclientd_data/common/static_html/**
      dst: opsiclientd_data/static_html/
    - src: opsiclientd_data/locale/**
      dst: opsiclientd_data/locale/
    - src: opsiclientd_data/${PLATFORM_SYSTEM}/**
      dst: opsiclientd_data/
    - src: opsiclientd_data/extend.d/*
      dst: opsiclientd_data/extend.d/
  dirname: opsiclientd
  after_script:
    linux:
      - mv dist/opsiclientd/_internal/opsiclientd_data dist/opsiclientd/
      - chmod -R g-w,o-w dist/opsiclientd
      - rm dist/opsiclientd/_internal/libpam.so*  # remove libpam.so* files so pam find_library falls back to system libpam
    darwin:
      - mv dist/opsiclientd/_internal/opsiclientd_data dist/opsiclientd/
      - chmod -R g-w,o-w dist/opsiclientd
    windows:
      - Move-Item -Path dist\opsiclientd\_internal\opsiclientd_data -Destination dist\opsiclientd\
